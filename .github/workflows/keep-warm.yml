# Prueft die Free-Tier-Demos und schlaegt Alarm, wenn eine schlaeft.
#
# ROLLENWECHSEL am 04.08.2026 -- vorher hiess dieser Workflow "haelt die Demos
# werktags wach". Das konnte er nachweislich nicht leisten:
#
#   Soll laut Cron ("7,27,47" stuendlich): ~39 Laeufe/Tag.
#   Tatsaechlich am 03.08.: 6 Laeufe.  Am 04.08.: 5 Laeufe.
#
# GitHub verwirft geplante Workflows auf dem Free-Tier unter Last, hier rund
# 85 %. Die Pings lagen damit 2-3 Stunden auseinander statt 20 Minuten, plus
# ein 12-Stunden-Loch ueber Nacht -- und genau in diesen Luecken sind die Apps
# eingeschlafen. Die krummen Minuten waren der vorherige Rettungsversuch und
# haben daran nichts geaendert.
#
# Konsequenz: Das eigentliche Warmhalten uebernimmt ein externer Scheduler
# (UptimeRobot/cron-job.org), der zuverlaessig feuert. Dieser Workflow misst
# nur noch, ob das funktioniert, und alarmiert wenn nicht.
#
# WICHTIG, hart erkauft: Die Wurzel-URL einer Streamlit-App taugt NICHT zum
# Anpingen. Sie antwortet mit 303 auf share.streamlit.io/-/auth/app, das wieder
# auf die App zeigt -- curl laeuft in 50 Redirects und bricht mit Exit 47 ab,
# nach ~15 s, ohne die App je erreicht zu haben. Im Log stand deshalb "303000"
# (die 303 von curl plus die 000 aus dem Fehlerzweig) statt einer 200.
# Ausgeliefert wird die App unter /~/+/ -- denselben Pfad benutzt auch das
# iframe im Chatfenster. Nur der bringt eine 200 mit echtem App-HTML.
#
# Was auch dieser Workflow NICHT kann: eine bereits schlafende App aufwecken.
# Der "Yes, get this app back up"-Knopf im Browser schickt POST
# /api/v2/app/resume, und das antwortet ohne angemeldete Sitzung mit 403.
# Wecken geht nur von Hand im Browser. Deshalb steht der Kaltstart-Hinweis
# weiterhin in READMEs und Demo-Fusszeilen.
#
# Praktischer Nebeneffekt: /~/+/ antwortet mit 400, sobald eine App
# eingeschlafen ist. Eine 400 im Log heisst also "diese Demo schlaeft gerade
# und muss von Hand geweckt werden".

name: keep-warm

on:
  schedule:
    # 7 Tage statt werktags: Recruiter schauen abends und am Wochenende, und
    # genau da war die Abdeckung vorher null. 5-20 UTC = 7-22 Uhr deutscher
    # Sommerzeit. Die Nacht bleibt bewusst frei -- ein 24/7-Ping waere
    # gegenueber dem kostenlosen Tier unfair, und es schaut ohnehin niemand.
    - cron: "7,27,47 5-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Demos pruefen
        run: |
          # Streamlit-Apps ueber /~/+/, sonst landet der Aufruf in der
          # Auth-Weiterleitungsschleife (siehe Kommentar oben). Vercel liefert
          # unter / direkt aus.
          urls=(
            "https://sql-copilot-portfolio.streamlit.app/~/+/"
            "https://ai-act-validation-toolkit.streamlit.app/~/+/"
            "https://cloud-native-pipeline.streamlit.app/~/+/"
            "https://second-brain-projects.streamlit.app/~/+/"
            "https://medical-coding-extractor.streamlit.app/~/+/"
            "https://ai-analytics-portal-gray.vercel.app/"
          )
          ok=0; schlafen=0
          for url in "${urls[@]}"; do
            # --max-redirs 3: eine Weiterleitungsschleife soll sofort auffallen
            # und nicht 15 s pro URL verbrennen.
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -L --max-redirs 3 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              ok=$((ok+1)); hinweis="wach"
            else
              schlafen=$((schlafen+1)); hinweis="SCHLAEFT bzw. nicht erreichbar -- nur von Hand weckbar"
            fi
            printf "%-4s %-58s %s\n" "$code" "$url" "$hinweis"
          done
          echo "---"
          echo "$ok wach, $schlafen nicht erreichbar."

          # Bewusste Umkehr der frueheren Entscheidung ("Der Job soll nicht rot
          # werden"): Solange dieser Workflow das Warmhalten selbst uebernahm,
          # war eine schlafende Demo fremdes Problem. Jetzt ist Alarmieren seine
          # einzige Aufgabe -- und ein fehlgeschlagener Lauf ist die einzige
          # Benachrichtigung, die GitHub ohne Drittanbieter verschickt. Ein
          # gruener Haken auf einem toten Portfolio waere das schlechtere
          # Ergebnis.
          if [ "$schlafen" -gt 0 ]; then
            echo "::error::$schlafen Demo(s) antworten nicht mit 200. Schlafende Streamlit-Apps im Browser wecken (Knopf 'Yes, get this app back up'). Haeuft sich das, prueft der externe Monitor nicht oft genug."
            exit 1
          fi
